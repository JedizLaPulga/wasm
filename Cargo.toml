[workspace]
members = [
    "apps/dashboard",
    "apps/admin-panel",
    "apps/user-profile",
    "shared",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <jedizlapulga@gmail.com>"]
description = "Multiple independent Dioxus WASM applications"
repository = "https://github.com/JedizLaPulga/wasm"
homepage = "https://github.com/JedizLaPulga/wasm"
documentation = "https://github.com/JedizLaPulga/wasm"
license = "MIT"

[workspace.dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-web = "0.7"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
wasm-shared = { path = "shared" }

[profile.release]
opt-level = "z"
lto = true
strip = true

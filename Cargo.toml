[package]
name = "wasm"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A WebAssembly project built with Dioxus"
repository = "https://github.com/<your-username>/wasm"
homepage = "https://github.com/<your-username>/wasm"
documentation = "https://github.com/<your-username>/wasm"
license = "MIT"
keywords = ["wasm", "dioxus", "web", "ui"]
categories = ["wasm", "web-assembly"]

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
dioxus-web = "0.6"
log = "0.4"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "1.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
